<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrcaPlay - Aviator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #0e0e0e;
            color: #ffffff;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Aviator Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #141414;
        }
        ::-webkit-scrollbar-thumb {
            background: #2c2c2c;
            border-radius: 2px;
        }

        .multiplier-history {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .multiplier-history::-webkit-scrollbar {
            display: none;
        }

        .pill-blue { background: #122538; color: #34b4ff; border: 1px solid #1a3c5e; }
        .pill-purple { background: #281238; color: #c038ff; border: 1px solid #4a186b; }
        .pill-magenta { background: #381228; color: #ff388c; border: 1px solid #6b1842; }

        .btn-bet-green {
            background: linear-gradient(180deg, #28a745 0%, #1e7e34 100%);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
        }
        .btn-bet-green:active {
            transform: scale(0.98);
        }

        .btn-cashout-orange {
            background: linear-gradient(180deg, #ff9900 0%, #d37b00 100%);
            box-shadow: 0 4px 12px rgba(255, 153, 0, 0.4);
        }

        .btn-cancel-red {
            background: linear-gradient(180deg, #dc3545 0%, #bd2130 100%);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
        }

        .bg-panel {
            background-color: #1b1c1d;
            border: 1px solid #282a2d;
        }

        .bg-inner-panel {
            background-color: #141516;
        }

        .tab-active {
            background-color: #2c2d30;
            color: #ffffff;
        }

        /* Pulse Animations */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.3; }
        }
        .animate-pulse-glow {
            animation: pulse-glow 1.5s infinite;
        }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto relative select-none">

    <script>
        // Telegram WebApp Initialization
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if(tg) {
            tg.expand();
            tg.enableClosingConfirmation();
        }

        // Web Audio Synthesizer (Realistic Sound FX)
        class AviatorAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.engineOsc = null;
                this.engineGain = null;
            }

            init() {
                if(!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTakeoff() {
                if(!this.enabled) return;
                this.init();
                
                try {
                    this.engineOsc = this.ctx.createOscillator();
                    this.engineGain = this.ctx.createGain();

                    this.engineOsc.type = 'sawtooth';
                    this.engineOsc.frequency.setValueAtTime(80, this.ctx.currentTime);

                    this.engineGain.gain.setValueAtTime(0.05, this.ctx.currentTime);

                    this.engineOsc.connect(this.engineGain);
                    this.engineGain.connect(this.ctx.destination);

                    this.engineOsc.start();
                } catch(e){}
            }

            updatePitch(multiplier) {
                if(this.engineOsc && this.ctx) {
                    const freq = Math.min(800, 80 + (multiplier * 60));
                    this.engineOsc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                }
            }

            playWin() {
                if(!this.enabled) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } catch(e){}
            }

            playCrash() {
                if(!this.enabled) return;
                this.stopEngine();
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.4);
                } catch(e){}
            }

            stopEngine() {
                if(this.engineOsc) {
                    try {
                        this.engineOsc.stop();
                        this.engineOsc.disconnect();
                    } catch(e){}
                    this.engineOsc = null;
                }
            }
        }

        const audio = new AviatorAudio();

        // App State Variables
        let balance = 3000.00;
        let gameState = 'waiting'; // 'waiting', 'flying', 'crashed'
        let currentMultiplier = 1.00;
        let crashPoint = 1.00;
        let flyStartTime = 0;
        
        // Panels Betting State
        const panels = {
            1: { amount: 1.00, state: 'idle', betPlaced: false, cashedOut: false, winAmount: 0 },
            2: { amount: 1.00, state: 'idle', betPlaced: false, cashedOut: false, winAmount: 0 }
        };

        // Canvas Engine
        const canvas = document.getElementById('aviatorCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Sync Telegram User Info
        if(tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = u.first_name || 'Oyunçu';
            document.getElementById('user-id').innerText = 'ID: ' + (u.id || '849201');
            document.getElementById('user-avatar').innerText = (u.first_name || 'U').charAt(0).toUpperCase();
        }

        // Dummy Players Feed Data Generator
        const fakeNames = ['Alex', 'Elvin', 'Rauf', 'CryptoKing', 'Samir', 'Vusal', 'Anna', 'Dmitry', 'Sarkhan', 'Leyla'];
        function generateLiveBets() {
            const container = document.getElementById('live-bets-feed');
            container.innerHTML = '';
            for(let i=0; i<8; i++) {
                const name = fakeNames[Math.floor(Math.random() * fakeNames.length)];
                const amt = (Math.random() * 20 + 1).toFixed(2);
                const hasWon = Math.random() > 0.4;
                const mult = (Math.random() * 3 + 1.1).toFixed(2);
                
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between py-1 border-b border-zinc-900/60 text-[11px]';
                row.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-5 h-5 rounded-full bg-zinc-800 text-gray-300 flex items-center justify-center font-bold text-[9px]">${name.charAt(0)}</span>
                        <span class="text-gray-300 font-bold">${name}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-gray-400 font-semibold">${amt} USD</span>
                        ${hasWon ? `<span class="pill-purple px-1.5 py-0.2 rounded font-extrabold text-[10px]">${mult}x</span>` : '<span class="text-zinc-600 font-bold">-</span>'}
                    </div>
                `;
                container.appendChild(row);
            }
        }
        generateLiveBets();

        // Game Loop & Canvas Rendering
        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Grid Lines
            ctx.strokeStyle = '#1a1b1e';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for(let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for(let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            if(gameState === 'flying' || gameState === 'crashed') {
                const startX = 30;
                const startY = canvas.height - 30;
                
                let progress = Math.min(1, (currentMultiplier - 1) / Math.max(2, crashPoint - 1));
                if(gameState === 'crashed') progress = 1;

                const endX = startX + (canvas.width - 90) * Math.min(1, progress);
                const endY = startY - (canvas.height - 80) * Math.min(1, progress);

                // Curved Flight Line Background Gradient
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(startX + (endX - startX) * 0.5, startY, endX, endY);
                ctx.lineTo(endX, startY);
                ctx.closePath();
                
                const fillGrad = ctx.createLinearGradient(0, endY, 0, startY);
                if(gameState === 'crashed') {
                    fillGrad.addColorStop(0, 'rgba(220, 53, 69, 0.3)');
                    fillGrad.addColorStop(1, 'rgba(220, 53, 69, 0.0)');
                } else {
                    fillGrad.addColorStop(0, 'rgba(220, 20, 60, 0.4)');
                    fillGrad.addColorStop(1, 'rgba(220, 20, 60, 0.0)');
                }
                ctx.fillStyle = fillGrad;
                ctx.fill();

                // Main Flight Curve Line
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(startX + (endX - startX) * 0.5, startY, endX, endY);
                ctx.strokeStyle = gameState === 'crashed' ? '#dc3545' : '#e01e37';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Red Airplane SVG Graphic
                if(gameState === 'flying') {
                    ctx.save();
                    ctx.translate(endX, endY);
                    
                    // Draw Airplane Body
                    ctx.fillStyle = '#ff1e43';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 16, 7, -Math.PI/12, 0, Math.PI * 2);
                    ctx.fill();

                    // Wings
                    ctx.fillStyle = '#b3001b';
                    ctx.beginPath();
                    ctx.moveTo(-2, -2);
                    ctx.lineTo(4, -12);
                    ctx.lineTo(8, -2);
                    ctx.closePath();
                    ctx.fill();

                    // Propeller Blur
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(16, 0, 8, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.restore();
                }
            }

            requestAnimationFrame(drawCanvas);
        }
        drawCanvas();

        // Game State Controller
        function startWaitingPeriod() {
            gameState = 'waiting';
            currentMultiplier = 1.00;
            audio.stopEngine();

            document.getElementById('waiting-text').classList.remove('hidden');
            document.getElementById('multiplier-display').classList.add('hidden');
            document.getElementById('crashed-display').classList.add('hidden');

            // Reset Panel States if scheduled for next round
            [1, 2].forEach(id => {
                const p = panels[id];
                if(p.state === 'queued') {
                    p.state = 'active';
                    p.betPlaced = true;
                    p.cashedOut = false;
                    updatePanelUI(id);
                }
            });

            setTimeout(() => {
                startFlightRound();
            }, 4000);
        }

        function startFlightRound() {
            gameState = 'flying';
            flyStartTime = Date.now();
            
            // Random Crash Point Generation
            const rand = Math.random();
            if(rand < 0.05) crashPoint = 1.00; // Instant crash
            else if(rand < 0.60) crashPoint = 1.05 + Math.random() * 1.8;
            else if(rand < 0.90) crashPoint = 2.0 + Math.random() * 4.0;
            else crashPoint = 6.0 + Math.random() * 15.0;

            document.getElementById('waiting-text').classList.add('hidden');
            document.getElementById('multiplier-display').classList.remove('hidden');

            audio.playTakeoff();

            const flyInterval = setInterval(() => {
                if(gameState !== 'flying') {
                    clearInterval(flyInterval);
                    return;
                }

                const elapsed = (Date.now() - flyStartTime) / 1000;
                currentMultiplier = Math.max(1.00, Math.pow(1.18, elapsed));

                audio.updatePitch(currentMultiplier);

                document.getElementById('multiplier-display').innerText = currentMultiplier.toFixed(2) + 'x';

                // Check Auto Cashouts
                [1, 2].forEach(id => {
                    const p = panels[id];
                    const autoChecked = document.getElementById(`p${id}-auto-enable`).checked;
                    const autoTarget = parseFloat(document.getElementById(`p${id}-auto-target`).value) || 2.0;

                    if(p.state === 'active' && !p.cashedOut && autoChecked && currentMultiplier >= autoTarget) {
                        cashout(id);
                    }
                });

                // Crash Check
                if(currentMultiplier >= crashPoint) {
                    clearInterval(flyInterval);
                    triggerCrash();
                }
            }, 50);
        }

        function triggerCrash() {
            gameState = 'crashed';
            audio.playCrash();

            document.getElementById('multiplier-display').classList.add('hidden');
            document.getElementById('crashed-display').classList.remove('hidden');
            document.getElementById('crashed-at-val').innerText = crashPoint.toFixed(2) + 'x -də';

            // Add to Multiplier History
            addHistoryPill(crashPoint.toFixed(2));

            // Mark Active Uncashed Bets as Lost
            [1, 2].forEach(id => {
                const p = panels[id];
                if(p.state === 'active' && !p.cashedOut) {
                    p.state = 'idle';
                    p.betPlaced = false;
                    updatePanelUI(id);
                }
            });

            // Refresh online count & bets feed
            document.getElementById('live-online-count').innerText = Math.floor(350 + Math.random() * 150);
            generateLiveBets();

            setTimeout(() => {
                startWaitingPeriod();
            }, 3000);
        }

        function addHistoryPill(val) {
            const list = document.getElementById('history-list');
            const num = parseFloat(val);
            let pillClass = 'pill-blue';
            if(num >= 2.0) pillClass = 'pill-purple';
            if(num >= 10.0) pillClass = 'pill-magenta';

            const pill = document.createElement('span');
            pill.className = `${pillClass} px-2 py-0.5 rounded-full animate-fade-in`;
            pill.innerText = val + 'x';
            
            list.insertBefore(pill, list.firstChild);
            if(list.children.length > 12) {
                list.removeChild(list.lastChild);
            }
        }

        // Betting Controls Logic
        function adjustBet(id, delta) {
            const p = panels[id];
            if(p.state !== 'idle') return;
            p.amount = Math.max(1.00, parseFloat((p.amount + delta).toFixed(2)));
            document.getElementById(`p${id}-amount`).innerText = p.amount.toFixed(2);
            document.getElementById(`p${id}-btn-val`).innerText = p.amount.toFixed(2) + ' USD';
        }

        function setBet(id, val) {
            const p = panels[id];
            if(p.state !== 'idle') return;
            p.amount = parseFloat(val.toFixed(2));
            document.getElementById(`p${id}-amount`).innerText = p.amount.toFixed(2);
            document.getElementById(`p${id}-btn-val`).innerText = p.amount.toFixed(2) + ' USD';
        }

        function handleBetClick(id) {
            const p = panels[id];

            if(p.state === 'idle') {
                if(balance < p.amount) {
                    alert('Balansınız çatmır!');
                    return;
                }

                balance -= p.amount;
                updateBalanceUI();

                if(gameState === 'waiting') {
                    p.state = 'active';
                    p.betPlaced = true;
                    p.cashedOut = false;
                } else {
                    p.state = 'queued'; // Queue for next round
                }
                updatePanelUI(id);

            } else if(p.state === 'queued') {
                // Cancel Queued Bet
                balance += p.amount;
                updateBalanceUI();
                p.state = 'idle';
                updatePanelUI(id);

            } else if(p.state === 'active' && gameState === 'flying' && !p.cashedOut) {
                // Manual Cashout
                cashout(id);
            }
        }

        function cashout(id) {
            const p = panels[id];
            if(p.cashedOut || p.state !== 'active') return;

            p.cashedOut = true;
            p.winAmount = p.amount * currentMultiplier;
            balance += p.winAmount;
            
            updateBalanceUI();
            audio.playWin();

            p.state = 'cashed_out';
            updatePanelUI(id);
        }

        function updatePanelUI(id) {
            const p = panels[id];
            const btn = document.getElementById(`p${id}-btn`);
            const label = document.getElementById(`p${id}-btn-label`);
            const val = document.getElementById(`p${id}-btn-val`);

            btn.className = 'w-36 h-20 rounded-xl flex flex-col items-center justify-center text-white transition-all ';

            if(p.state === 'idle') {
                btn.classList.add('btn-bet-green');
                label.innerText = 'BET';
                val.innerText = p.amount.toFixed(2) + ' USD';
            } else if(p.state === 'queued') {
                btn.classList.add('btn-cancel-red');
                label.innerText = 'LƏĞV ET';
                val.innerText = 'Gözlənilir...';
            } else if(p.state === 'active') {
                if(gameState === 'flying') {
                    btn.classList.add('btn-cashout-orange');
                    label.innerText = 'CASHOUT';
                    val.innerText = (p.amount * currentMultiplier).toFixed(2) + ' USD';
                } else {
                    btn.classList.add('btn-cancel-red');
                    label.innerText = 'LƏĞV ET';
                    val.innerText = 'Raund Başlayır';
                }
            } else if(p.state === 'cashed_out') {
                btn.classList.add('btn-bet-green');
                label.innerText = 'QAZANDIN!';
                val.innerText = '+' + p.winAmount.toFixed(2) + ' USD';
                
                setTimeout(() => {
                    p.state = 'idle';
                    updatePanelUI(id);
                }, 2000);
            }
        }

        function switchBetTab(id, tab) {
            const betTab = document.getElementById(`p${id}-tab-bet`);
            const autoTab = document.getElementById(`p${id}-tab-auto`);
            const autoOpts = document.getElementById(`p${id}-auto-opts`);

            if(tab === 'bet') {
                betTab.className = 'flex-1 py-1 rounded-md text-center tab-active';
                autoTab.className = 'flex-1 py-1 rounded-md text-center text-gray-400';
                autoOpts.classList.add('hidden');
            } else {
                autoTab.className = 'flex-1 py-1 rounded-md text-center tab-active';
                betTab.className = 'flex-1 py-1 rounded-md text-center text-gray-400';
                autoOpts.classList.remove('hidden');
            }
        }

        // Global UI Helpers
        function updateBalanceUI() {
            document.getElementById('balance-val').innerText = balance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('hidden');
        }

        function toggleSound() {
            audio.enabled = !audio.enabled;
            document.getElementById('sound-status').innerText = audio.enabled ? 'AÇIQ' : 'BAĞLI';
            document.getElementById('sound-status').className = audio.enabled ? 'text-xs text-green-400' : 'text-xs text-red-500';
        }

        function openDepositModal() {
            document.getElementById('side-menu').classList.add('hidden');
            document.getElementById('deposit-modal').classList.remove('hidden');
        }

        function closeDepositModal() {
            document.getElementById('deposit-modal').classList.add('hidden');
        }

        function confirmDeposit() {
            const amt = parseFloat(document.getElementById('dep-amount').value) || 0;
            if(amt <= 0) return;
            balance += amt;
            updateBalanceUI();
            closeDepositModal();
            alert(`Balansınıza ${amt} USD əlavə olundu!`);
        }

        function openWithdrawModal() {
            document.getElementById('side-menu').classList.add('hidden');
            alert('Minimum çıxarış məbləği 20 USD-dir.');
        }

        // Start Game
        startWaitingPeriod();
    </script>
</body>
