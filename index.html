<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrcaPlay Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Spribe Aviator Custom Styles */
        .aviator-logo {
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            font-style: italic;
            color: #e50914;
            letter-spacing: -0.5px;
        }

        .pill-blue { background: #122538; color: #34b4ff; border: 1px solid #1a3c5e; }
        .pill-purple { background: #281238; color: #c038ff; border: 1px solid #4a186b; }
        .pill-magenta { background: #381228; color: #ff388c; border: 1px solid #6b1842; }

        .btn-green-spribe {
            background: #28a745;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
            border-radius: 12px;
        }
        .btn-green-spribe:active { transform: scale(0.97); }

        .btn-orange-spribe {
            background: #d37b00;
            box-shadow: 0 4px 10px rgba(211, 123, 0, 0.3);
            border-radius: 12px;
        }

        .tab-btn { background: #18191a; color: #888888; border-radius: 20px; }
        .tab-btn.active { background: #2c2d30; color: #ffffff; }

        .sunburst {
            background: repeating-conic-gradient(
                from 0deg,
                #1a0510 0deg 15deg,
                #0f0209 15deg 30deg
            );
        }

        /* Bottom Nav Active State */
        .nav-active {
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="max-w-md mx-auto relative flex flex-col h-full w-full">

    <!-- Top Common Header -->
    <header class="bg-black/80 backdrop-blur px-4 py-2.5 flex items-center justify-between border-b border-zinc-800/80 z-30">
        <div class="flex items-center gap-2">
            <span class="font-black text-xl italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600">OrcaPlay</span>
        </div>
        
        <div class="flex items-center gap-2 bg-zinc-900 border border-cyan-500/30 rounded-full px-3 py-1">
            <i class="fa-solid fa-wallet text-cyan-400 text-xs"></i>
            <span id="global-balance" class="text-green-400 font-extrabold text-sm">3,000.00</span>
            <span class="text-[10px] text-gray-400 font-bold">USD</span>
        </div>
    </header>

    <!-- SECTION 1: GAMES MENU (Oyunlar) -->
    <div id="sec-games" class="flex-1 flex flex-col overflow-hidden relative">
        <!-- Spribe Aviator Header Bar -->
        <div class="bg-black px-3 py-1.5 flex items-center justify-between border-b border-zinc-900">
            <span class="aviator-logo text-xl">Aviator</span>
            <span class="bg-amber-600 text-black text-[10px] font-black px-2 py-0.5 rounded">FUN MODE</span>
        </div>

        <!-- Multipliers History Bar -->
        <div class="bg-black px-2 py-1 flex items-center gap-1 border-b border-zinc-900 overflow-x-auto">
            <div id="history-list" class="flex items-center gap-1.5 text-[11px] font-bold w-full overflow-x-auto">
                <span class="pill-blue px-2 py-0.5 rounded-full">1.20x</span>
                <span class="pill-blue px-2 py-0.5 rounded-full">1.15x</span>
                <span class="pill-purple px-2 py-0.5 rounded-full">1.96x</span>
                <span class="pill-purple px-2 py-0.5 rounded-full">2.20x</span>
                <span class="pill-magenta px-2 py-0.5 rounded-full">4.74x</span>
            </div>
        </div>

        <!-- Game Screen Canvas -->
        <div class="relative w-full h-44 bg-black flex-shrink-0 overflow-hidden">
            <div class="relative w-full h-full sunburst flex items-center justify-center">
                <canvas id="aviatorCanvas" class="absolute inset-0 w-full h-full"></canvas>

                <div id="multiplier-display" class="relative z-10 text-white font-black text-5xl drop-shadow-2xl">
                    1.00x
                </div>

                <div id="waiting-text" class="hidden relative z-10 text-amber-500 font-bold text-sm uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-spinner animate-spin"></i> GÖZLƏNİLİR...
                </div>

                <div id="crashed-display" class="hidden relative z-10 text-center">
                    <div class="text-red-600 font-black text-3xl uppercase tracking-widest">UÇDU GETDİ!</div>
                    <div id="crashed-at-val" class="text-gray-400 font-bold text-xs mt-0.5">1.00x</div>
                </div>
            </div>
        </div>

        <!-- Dual Betting Panels -->
        <div class="flex-1 bg-black p-2 space-y-2 overflow-y-auto pb-16">
            <!-- Panel 1 -->
            <div class="bg-zinc-900/90 rounded-xl p-2 border border-zinc-800">
                <div class="flex justify-center mb-1.5">
                    <div class="flex bg-black p-0.5 rounded-full w-36 text-[10px] font-bold border border-zinc-800">
                        <button id="p1-tab-bet" onclick="switchBetTab(1, 'bet')" class="flex-1 py-0.5 tab-btn active">Bet</button>
                        <button id="p1-tab-auto" onclick="switchBetTab(1, 'auto')" class="flex-1 py-0.5 tab-btn">Auto</button>
                    </div>
                </div>
                <div class="flex gap-2 items-center">
                    <div class="flex-1 flex flex-col justify-between h-16 bg-black rounded-lg p-1 border border-zinc-800">
                        <div class="flex items-center justify-between px-1">
                            <button onclick="adjustBet(1, -1)" class="text-gray-400 font-black text-xs">-</button>
                            <span id="p1-amount" class="font-black text-white text-sm">1.00</span>
                            <button onclick="adjustBet(1, 1)" class="text-gray-400 font-black text-xs">+</button>
                        </div>
                        <div class="grid grid-cols-4 gap-1">
                            <button onclick="setBet(1, 1)" class="bg-zinc-800 text-gray-300 font-bold text-[9px] py-0.5 rounded">1</button>
                            <button onclick="setBet(1, 2)" class="bg-zinc-800 text-gray-300 font-bold text-[9px] py-0.5 rounded">2</button>
                            <button onclick="setBet(1, 5)" class="bg-zinc-800 text-gray-300 font-bold text-[9px] py-0.5 rounded">5</button>
                            <button onclick="setBet(1, 10)" class="bg-zinc-800 text-gray-300 font-bold text-[9px] py-0.5 rounded">10</button>
                        </div>
                    </div>
                    <button id="p1-btn" onclick="handleBetClick(1)" class="w-28 h-16 btn-green-spribe flex flex-col items-center justify-center text-white">
                        <span id="p1-btn-label" class="text-xs font-extrabold uppercase">Bet</span>
                        <span id="p1-btn-val" class="text-sm font-black">1.00 USD</span>
                    </button>
                </div>
            </div>

            <!-- Panel 2 -->
            <div class="bg-zinc-900/90 rounded-xl p-2 border border-zinc-800">
                <div class="flex justify-center mb-1.5">
                    <div class="flex bg-black p-0.5 rounded-full w-36 text-[10px] font-bold border border-zinc-800">
                        <button id="p2-tab-bet" onclick="switchBetTab(2, 'bet')" class="flex-1 py-0.5 tab-btn active">Bet</button>
                        <button id="p2-tab-auto" onclick="switchBetTab(2, 'auto')" class="flex-1 py-0.5 tab-btn">Auto</button>
                    </div>
                </div>
                <div class="flex gap-2 items-center">
                    <div class="flex-1 flex flex-col justify-between h-16 bg-black rounded-lg p-1 border border-zinc-800">
                        <div class="flex items-center justify-between px-1">
                            <button onclick="adjustBet(2, -1)" class="text-gray-400 font-black text-xs">-</button>
                            <span id="p2-amount" class="font-black text-white text-sm">1.00</span>
                            <button onclick="adjustBet(2, 1)" class="text-gray-400 font-black text-xs">+</button>
                        </div>
                        <div class="grid grid-cols-4 gap-1">
                            <button onclick="setBet(2, 1)" class="bg-zinc-800 text-gray-300 font-bold text-[9px] py-0.5 rounded">1</button>
                            <button onclick="setBet(2, 2)" class="bg-zinc-800 text-gray-300 font-bold text-[9px] py-0.5 rounded">2</button>
                            <button onclick="setBet(2, 5)" class="bg-zinc-800 text-gray-300 font-bold text-[9px] py-0.5 rounded">5</button>
                            <button onclick="setBet(2, 10)" class="bg-zinc-800 text-gray-300 font-bold text-[9px] py-0.5 rounded">10</button>
                        </div>
                    </div>
                    <button id="p2-btn" onclick="handleBetClick(2)" class="w-28 h-16 btn-green-spribe flex flex-col items-center justify-center text-white">
                        <span id="p2-btn-label" class="text-xs font-extrabold uppercase">Bet</span>
                        <span id="p2-btn-val" class="text-sm font-black">1.00 USD</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SECTION 2: DEPOSIT (Depozit) -->
    <div id="sec-deposit" class="hidden flex-1 p-4 overflow-y-auto pb-20">
        <h2 class="text-lg font-black text-white mb-4 flex items-center gap-2">
            <i class="fa-solid fa-wallet text-cyan-400"></i> Balansı Artır
        </h2>
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-4">
            <div>
                <label class="text-xs text-gray-400 font-bold block mb-1">Məbləğ (USD):</label>
                <input type="number" id="dep-input-amt" value="50" class="w-full bg-black border border-zinc-700 rounded-xl p-3 text-white font-extrabold text-lg focus:outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="text-xs text-gray-400 font-bold block mb-1">Ödəniş Üsulu:</label>
                <select class="w-full bg-black border border-zinc-700 rounded-xl p-3 text-white text-sm font-bold focus:outline-none">
                    <option>CryptoBot (USDT / TON)</option>
                    <option>Bank Kartı (AZN)</option>
                </select>
            </div>
            <button onclick="submitDeposit()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-black py-3.5 rounded-xl text-base shadow-lg shadow-cyan-500/20 active:scale-98">
                Ödənişə Keç
            </button>
        </div>
    </div>

    <!-- SECTION 3: WITHDRAW (Çıxarış) -->
    <div id="sec-withdraw" class="hidden flex-1 p-4 overflow-y-auto pb-20">
        <h2 class="text-lg font-black text-white mb-4 flex items-center gap-2">
            <i class="fa-solid fa-money-bill-transfer text-green-400"></i> Balans Çıxarışı
        </h2>
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-4">
            <div>
                <label class="text-xs text-gray-400 font-bold block mb-1">Çıxarış Məbləği (USD):</label>
                <input type="number" id="with-input-amt" value="20" class="w-full bg-black border border-zinc-700 rounded-xl p-3 text-white font-extrabold text-lg focus:outline-none focus:border-green-400">
            </div>
            <div>
                <label class="text-xs text-gray-400 font-bold block mb-1">Hesab və ya Kripto Unvanı:</label>
                <input type="text" placeholder="TRC20 / TON ünvanı" class="w-full bg-black border border-zinc-700 rounded-xl p-3 text-white text-sm focus:outline-none">
            </div>
            <button onclick="submitWithdraw()" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white font-black py-3.5 rounded-xl text-base shadow-lg shadow-green-500/20 active:scale-98">
                Tələb Göndər
            </button>
        </div>
    </div>

    <!-- SECTION 4: PROFILE (Profil) -->
    <div id="sec-profile" class="hidden flex-1 p-4 overflow-y-auto pb-20">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 text-center mb-4 relative overflow-hidden">
            <div class="w-16 h-16 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-full mx-auto flex items-center justify-center font-black text-2xl text-white shadow-lg shadow-cyan-500/30 mb-2" id="prof-avatar">
                U
            </div>
            <h3 class="text-base font-black text-white" id="prof-name">Oyunçu</h3>
            <p class="text-xs text-gray-500 font-bold mt-0.5" id="prof-id">ID: 849201</p>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between py-2 border-b border-zinc-800 text-xs">
                <span class="text-gray-400">Ümumi Balans:</span>
                <span id="prof-bal" class="text-green-400 font-extrabold text-sm">3,000.00 USD</span>
            </div>
            <div class="flex items-center justify-between py-2 border-b border-zinc-800 text-xs">
                <span class="text-gray-400">Status:</span>
                <span class="text-cyan-400 font-extrabold">VIP Oyunçu</span>
            </div>
            <div class="flex items-center justify-between py-2 text-xs">
                <span class="text-gray-400">Səs Effektləri:</span>
                <button onclick="toggleSound()" id="sound-btn" class="bg-zinc-800 px-3 py-1 rounded-full text-green-400 font-bold">AÇIQ</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-black/95 backdrop-blur border-t border-zinc-800/80 flex justify-around py-2 z-40">
        <button onclick="navTo('sec-games', this)" class="flex flex-col items-center gap-0.5 nav-active">
            <i class="fa-solid fa-gamepad text-lg"></i>
            <span class="text-[10px] font-bold">Oyunlar</span>
        </button>
        <button onclick="navTo('sec-deposit', this)" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-white">
            <i class="fa-solid fa-wallet text-lg"></i>
            <span class="text-[10px] font-bold">Depozit</span>
        </button>
        <button onclick="navTo('sec-withdraw', this)" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-white">
            <i class="fa-solid fa-money-bill-transfer text-lg"></i>
            <span class="text-[10px] font-bold">Çıxarış</span>
        </button>
        <button onclick="navTo('sec-profile', this)" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-white">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] font-bold">Profil</span>
        </button>
    </nav>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if(tg) {
            tg.expand();
            if(tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const u = tg.initDataUnsafe.user;
                document.getElementById('prof-name').innerText = u.first_name || 'Oyunçu';
                document.getElementById('prof-id').innerText = 'ID: ' + (u.id || '849201');
                document.getElementById('prof-avatar').innerText = (u.first_name || 'U').charAt(0).toUpperCase();
            }
        }

        // Global State
        let balance = 3000.00;
        let soundEnabled = true;

        function updateBalanceUI() {
            const formatted = balance.toLocaleString('en-US', { minimumFractionDigits: 2 });
            document.getElementById('global-balance').innerText = formatted;
            document.getElementById('prof-bal').innerText = formatted + ' USD';
        }

        function navTo(secId, btnEl) {
            ['sec-games', 'sec-deposit', 'sec-withdraw', 'sec-profile'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(secId).classList.remove('hidden');

            document.querySelectorAll('nav button').forEach(b => {
                b.className = 'flex flex-col items-center gap-0.5 text-gray-500 hover:text-white';
            });
            btnEl.className = 'flex flex-col items-center gap-0.5 nav-active';
        }

        // Aviator Game Logic
        let gameState = 'flying';
        let currentMultiplier = 1.00;
        let crashPoint = 2.64;
        let flyStartTime = Date.now();

        const panels = {
            1: { amount: 1.00, state: 'idle' },
            2: { amount: 1.00, state: 'idle' }
        };

        const canvas = document.getElementById('aviatorCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if(gameState === 'flying' || gameState === 'crashed') {
                const startX = 20;
                const startY = canvas.height - 20;
                
                const progress = Math.min(1, (currentMultiplier - 1) / Math.max(1.5, crashPoint - 1));
                const endX = startX + (canvas.width - 50) * progress;
                const endY = startY - (canvas.height - 40) * progress;

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(startX + (endX - startX) * 0.4, startY, endX, endY);
                ctx.lineTo(endX, startY);
                ctx.closePath();
                
                const grad = ctx.createLinearGradient(0, endY, 0, startY);
                grad.addColorStop(0, 'rgba(229, 9, 20, 0.5)');
                grad.addColorStop(1, 'rgba(229, 9, 20, 0.0)');
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(startX + (endX - startX) * 0.4, startY, endX, endY);
                ctx.strokeStyle = '#e50914';
                ctx.lineWidth = 3;
                ctx.stroke();

                if(gameState === 'flying') {
                    ctx.save();
                    ctx.translate(endX, endY);
                    ctx.fillStyle = '#e50914';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 12, 5, -Math.PI/12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
            requestAnimationFrame(drawCanvas);
        }
        drawCanvas();

        function startFlightRound() {
            gameState = 'flying';
            flyStartTime = Date.now();
            crashPoint = (1.1 + Math.random() * 4.5);

            document.getElementById('waiting-text').classList.add('hidden');
            document.getElementById('crashed-display').classList.add('hidden');
            document.getElementById('multiplier-display').classList.remove('hidden');

            const flyInterval = setInterval(() => {
                if(gameState !== 'flying') {
                    clearInterval(flyInterval);
                    return;
                }

                const elapsed = (Date.now() - flyStartTime) / 1000;
                currentMultiplier = Math.max(1.00, Math.pow(1.18, elapsed));
                document.getElementById('multiplier-display').innerText = currentMultiplier.toFixed(2) + 'x';

                if(currentMultiplier >= crashPoint) {
                    clearInterval(flyInterval);
                    triggerCrash();
                }
            }, 50);
        }

        function triggerCrash() {
            gameState = 'crashed';
            document.getElementById('multiplier-display').classList.add('hidden');
            document.getElementById('crashed-display').classList.remove('hidden');
            document.getElementById('crashed-at-val').innerText = crashPoint.toFixed(2) + 'x';

            [1, 2].forEach(id => {
                if(panels[id].state === 'active') {
                    panels[id].state = 'idle';
                    updatePanelUI(id);
                }
            });

            setTimeout(() => {
                document.getElementById('crashed-display').classList.add('hidden');
                document.getElementById('waiting-text').classList.remove('hidden');
                setTimeout(startFlightRound, 2500);
            }, 2000);
        }

        function adjustBet(id, delta) {
            const p = panels[id];
            if(p.state !== 'idle') return;
            p.amount = Math.max(1.00, parseFloat((p.amount + delta).toFixed(2)));
            document.getElementById(`p${id}-amount`).innerText = p.amount.toFixed(2);
            document.getElementById(`p${id}-btn-val`).innerText = p.amount.toFixed(2) + ' USD';
        }

        function setBet(id, val) {
            const p = panels[id];
            if(p.state !== 'idle') return;
            p.amount = parseFloat(val.toFixed(2));
            document.getElementById(`p${id}-amount`).innerText = p.amount.toFixed(2);
            document.getElementById(`p${id}-btn-val`).innerText = p.amount.toFixed(2) + ' USD';
        }

        function handleBetClick(id) {
            const p = panels[id];
            if(p.state === 'idle') {
                if(balance < p.amount) { alert('Balansınız çatmır!'); return; }
                balance -= p.amount;
                updateBalanceUI();
                p.state = 'active';
                updatePanelUI(id);
            } else if(p.state === 'active' && gameState === 'flying') {
                balance += (p.amount * currentMultiplier);
                updateBalanceUI();
                p.state = 'idle';
                updatePanelUI(id);
            }
        }

        function updatePanelUI(id) {
            const p = panels[id];
            const btn = document.getElementById(`p${id}-btn`);
            const label = document.getElementById(`p${id}-btn-label`);
            const val = document.getElementById(`p${id}-btn-val`);

            if(p.state === 'idle') {
                btn.className = 'w-28 h-16 btn-green-spribe flex flex-col items-center justify-center text-white';
                label.innerText = 'Bet';
                val.innerText = p.amount.toFixed(2) + ' USD';
            } else if(p.state === 'active') {
                btn.className = 'w-28 h-16 btn-orange-spribe flex flex-col items-center justify-center text-white';
                label.innerText = 'CASH OUT';
                val.innerText = (p.amount * currentMultiplier).toFixed(2) + ' USD';
            }
        }

        function switchBetTab(id, tab) {
            const b = document.getElementById(`p${id}-tab-bet`);
            const a = document.getElementById(`p${id}-tab-auto`);
            if(tab === 'bet') {
                b.className = 'flex-1 py-0.5 tab-btn active';
                a.className = 'flex-1 py-0.5 tab-btn';
            } else {
                a.className = 'flex-1 py-0.5 tab-btn active';
                b.className = 'flex-1 py-0.5 tab-btn';
            }
        }

        function submitDeposit() {
            const amt = parseFloat(document.getElementById('dep-input-amt').value) || 0;
            if(amt <= 0) return;
            balance += amt;
            updateBalanceUI();
            alert(`${amt} USD balansınıza əlavə edildi!`);
        }

        function submitWithdraw() {
            const amt = parseFloat(document.getElementById('with-input-amt').value) || 0;
            if(amt > balance) { alert('Balansınızda kifayət kadar vəsait yoxdur!'); return; }
            balance -= amt;
            updateBalanceUI();
            alert('Çıxarış sorğusu qəbul olundu!');
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerText = soundEnabled ? 'AÇIQ' : 'BAĞLI';
            document.getElementById('sound-btn').className = soundEnabled ? 'bg-zinc-800 px-3 py-1 rounded-full text-green-400 font-bold' : 'bg-zinc-800 px-3 py-1 rounded-full text-red-500 font-bold';
        }

        startFlightRound();
    </script>
</body>
</html>
