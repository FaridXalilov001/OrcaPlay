<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Spribe Aviator Custom Colors & Styles */
        .spribe-bg { background-color: #0d0d0d; }
        .panel-bg { background-color: #1b1c1d; }
        .inner-bg { background-color: #141516; }

        .aviator-logo {
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            font-style: italic;
            color: #e50914;
            letter-spacing: -0.5px;
        }

        .pill-blue { background: #122538; color: #34b4ff; border: 1px solid #1a3c5e; }
        .pill-purple { background: #281238; color: #c038ff; border: 1px solid #4a186b; }
        .pill-magenta { background: #381228; color: #ff388c; border: 1px solid #6b1842; }

        .fun-mode-banner {
            background: #d97706;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .btn-green-spribe {
            background: #28a745;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
            border-radius: 12px;
        }
        .btn-green-spribe:active {
            transform: scale(0.97);
            background: #218838;
        }

        .btn-orange-spribe {
            background: #d37b00;
            box-shadow: 0 4px 10px rgba(211, 123, 0, 0.3);
            border-radius: 12px;
        }

        .tab-btn {
            background: #18191a;
            color: #888888;
            border-radius: 20px;
        }
        .tab-btn.active {
            background: #2c2d30;
            color: #ffffff;
        }

        /* Sunburst Background Effect for Screen */
        .sunburst {
            background: repeating-conic-gradient(
                from 0deg,
                #1a0510 0deg 15deg,
                #0f0209 15deg 30deg
            );
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="max-w-md mx-auto relative flex flex-col h-full w-full">

    <!-- Top Spribe Header -->
    <header class="bg-black px-3 py-2 flex items-center justify-between border-b border-zinc-900 z-20 flex-shrink-0">
        <div class="flex items-center gap-1">
            <span class="aviator-logo text-2xl tracking-tight">Aviator</span>
        </div>
        
        <div class="flex items-center gap-3">
            <div class="flex items-center text-green-500 font-bold text-base gap-1">
                <span id="balance-val">3,000.00</span>
                <span class="text-xs text-gray-400">USD</span>
            </div>
            <button onclick="toggleMenu()" class="text-gray-400 hover:text-white text-xl">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Side Menu Dropdown -->
    <div id="side-menu" class="hidden absolute top-12 right-2 w-52 bg-zinc-900 border border-zinc-800 rounded-lg shadow-2xl z-50 p-3 text-xs">
        <div class="flex items-center gap-2 pb-2 border-b border-zinc-800">
            <div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center font-bold text-white">U</div>
            <div>
                <div id="user-name" class="font-bold text-white">Oyunçu</div>
                <div id="user-id" class="text-[10px] text-gray-500">ID: 948201</div>
            </div>
        </div>
        <div class="py-2 flex flex-col gap-1">
            <button onclick="openDepositModal()" class="flex items-center justify-between w-full p-2 rounded hover:bg-zinc-800 text-green-400 font-bold">
                <span><i class="fa-solid fa-wallet mr-2"></i> Depozit</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
            <button onclick="toggleSound()" class="flex items-center justify-between w-full p-2 rounded hover:bg-zinc-800 text-gray-300">
                <span><i id="sound-icon" class="fa-solid fa-volume-high mr-2"></i> Səs Effektləri</span>
                <span id="sound-status" class="text-green-400 font-bold">AÇIQ</span>
            </button>
        </div>
    </div>

    <!-- Multipliers History Bar -->
    <div class="bg-black/90 px-2 py-1 flex items-center gap-1 border-b border-zinc-900 overflow-x-auto flex-shrink-0">
        <div id="history-list" class="flex items-center gap-1.5 text-[11px] font-bold w-full overflow-x-auto">
            <span class="pill-blue px-2 py-0.5 rounded-full">1.20x</span>
            <span class="pill-blue px-2 py-0.5 rounded-full">1.15x</span>
            <span class="pill-purple px-2 py-0.5 rounded-full">1.96x</span>
            <span class="pill-purple px-2 py-0.5 rounded-full">2.20x</span>
            <span class="pill-blue px-2 py-0.5 rounded-full">1.25x</span>
            <span class="pill-blue px-2 py-0.5 rounded-full">1.05x</span>
            <span class="pill-magenta px-2 py-0.5 rounded-full">4.74x</span>
            <span class="pill-magenta px-2 py-0.5 rounded-full">11.59x</span>
        </div>
        <button class="text-gray-500 px-1 text-xs"><i class="fa-solid fa-ellipsis-vertical"></i></button>
    </div>

    <!-- Main Game Screen -->
    <div class="relative w-full h-48 bg-black flex-shrink-0 overflow-hidden border-b border-zinc-800">
        <!-- FUN MODE Banner -->
        <div class="fun-mode-banner text-center py-0.5 uppercase tracking-wide">
            FUN MODE
        </div>

        <!-- Canvas Visuals -->
        <div class="relative w-full h-full sunburst flex items-center justify-center">
            <canvas id="aviatorCanvas" class="absolute inset-0 w-full h-full"></canvas>

            <!-- Multiplier Counter Display -->
            <div id="multiplier-display" class="relative z-10 text-white font-black text-6xl tracking-tight drop-shadow-2xl">
                1.00x
            </div>

            <div id="waiting-text" class="hidden relative z-10 text-amber-500 font-bold text-lg uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-spinner animate-spin"></i> NÖVBƏTİ RAUND GÖZLƏNİLİR...
            </div>

            <div id="crashed-display" class="hidden relative z-10 text-center">
                <div class="text-red-600 font-black text-4xl uppercase tracking-widest">UÇDU GETDİ!</div>
                <div id="crashed-at-val" class="text-gray-400 font-bold text-sm mt-1">1.00x</div>
            </div>

            <!-- Avatars Badge Bottom Right -->
            <div class="absolute bottom-2 right-2 flex items-center gap-1 bg-black/60 backdrop-blur px-2 py-0.5 rounded-full text-xs text-gray-300 border border-zinc-800">
                <div class="flex -space-x-1.5 overflow-hidden">
                    <img class="inline-block h-4 w-4 rounded-full ring-1 ring-zinc-800" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="">
                    <img class="inline-block h-4 w-4 rounded-full ring-1 ring-zinc-800" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" alt="">
                </div>
                <span id="live-online-count" class="font-bold text-[11px] ml-1">205</span>
            </div>
        </div>
    </div>

    <!-- Dual Betting Control Panels -->
    <div class="flex-1 bg-black p-2 space-y-2 overflow-y-auto">
        
        <!-- PANEL 1 -->
        <div class="panel-bg rounded-2xl p-2.5 border border-zinc-800/80">
            <!-- Bet / Auto Mode Switcher -->
            <div class="flex justify-center mb-2">
                <div class="flex bg-inner-bg p-0.5 rounded-full w-44 text-xs font-bold border border-zinc-800">
                    <button id="p1-tab-bet" onclick="switchBetTab(1, 'bet')" class="flex-1 py-1 tab-btn active">Bet</button>
                    <button id="p1-tab-auto" onclick="switchBetTab(1, 'auto')" class="flex-1 py-1 tab-btn">Auto</button>
                </div>
            </div>

            <div class="flex gap-2 items-center">
                <!-- Amount Box -->
                <div class="flex-1 flex flex-col justify-between h-20 bg-inner-bg rounded-xl p-1.5 border border-zinc-800">
                    <div class="flex items-center justify-between bg-zinc-900 rounded-lg px-2 py-1">
                        <button onclick="adjustBet(1, -1)" class="w-6 h-6 rounded-full bg-zinc-800 text-gray-300 font-bold flex items-center justify-center text-sm">-</button>
                        <span id="p1-amount" class="font-black text-white text-base">1.00</span>
                        <button onclick="adjustBet(1, 1)" class="w-6 h-6 rounded-full bg-zinc-800 text-gray-300 font-bold flex items-center justify-center text-sm">+</button>
                    </div>
                    <div class="grid grid-cols-4 gap-1 mt-1">
                        <button onclick="setBet(1, 1)" class="bg-zinc-800/80 hover:bg-zinc-700 text-gray-300 font-bold text-[11px] py-0.5 rounded-md">1</button>
                        <button onclick="setBet(1, 2)" class="bg-zinc-800/80 hover:bg-zinc-700 text-gray-300 font-bold text-[11px] py-0.5 rounded-md">2</button>
                        <button onclick="setBet(1, 5)" class="bg-zinc-800/80 hover:bg-zinc-700 text-gray-300 font-bold text-[11px] py-0.5 rounded-md">5</button>
                        <button onclick="setBet(1, 10)" class="bg-zinc-800/80 hover:bg-zinc-700 text-gray-300 font-bold text-[11px] py-0.5 rounded-md">10</button>
                    </div>
                </div>

                <!-- Green Bet Button -->
                <button id="p1-btn" onclick="handleBetClick(1)" class="w-36 h-20 btn-green-spribe flex flex-col items-center justify-center text-white">
                    <span id="p1-btn-label" class="text-base font-extrabold uppercase">Bet</span>
                    <span id="p1-btn-val" class="text-lg font-black">1.00 USD</span>
                </button>
            </div>
        </div>

        <!-- PANEL 2 -->
        <div class="panel-bg rounded-2xl p-2.5 border border-zinc-800/80">
            <div class="flex justify-center mb-2">
                <div class="flex bg-inner-bg p-0.5 rounded-full w-44 text-xs font-bold border border-zinc-800">
                    <button id="p2-tab-bet" onclick="switchBetTab(2, 'bet')" class="flex-1 py-1 tab-btn active">Bet</button>
                    <button id="p2-tab-auto" onclick="switchBetTab(2, 'auto')" class="flex-1 py-1 tab-btn">Auto</button>
                </div>
            </div>

            <div class="flex gap-2 items-center">
                <div class="flex-1 flex flex-col justify-between h-20 bg-inner-bg rounded-xl p-1.5 border border-zinc-800">
                    <div class="flex items-center justify-between bg-zinc-900 rounded-lg px-2 py-1">
                        <button onclick="adjustBet(2, -1)" class="w-6 h-6 rounded-full bg-zinc-800 text-gray-300 font-bold flex items-center justify-center text-sm">-</button>
                        <span id="p2-amount" class="font-black text-white text-base">1.00</span>
                        <button onclick="adjustBet(2, 1)" class="w-6 h-6 rounded-full bg-zinc-800 text-gray-300 font-bold flex items-center justify-center text-sm">+</button>
                    </div>
                    <div class="grid grid-cols-4 gap-1 mt-1">
                        <button onclick="setBet(2, 1)" class="bg-zinc-800/80 hover:bg-zinc-700 text-gray-300 font-bold text-[11px] py-0.5 rounded-md">1</button>
                        <button onclick="setBet(2, 2)" class="bg-zinc-800/80 hover:bg-zinc-700 text-gray-300 font-bold text-[11px] py-0.5 rounded-md">2</button>
                        <button onclick="setBet(2, 5)" class="bg-zinc-800/80 hover:bg-zinc-700 text-gray-300 font-bold text-[11px] py-0.5 rounded-md">5</button>
                        <button onclick="setBet(2, 10)" class="bg-zinc-800/80 hover:bg-zinc-700 text-gray-300 font-bold text-[11px] py-0.5 rounded-md">10</button>
                    </div>
                </div>

                <button id="p2-btn" onclick="handleBetClick(2)" class="w-36 h-20 btn-green-spribe flex flex-col items-center justify-center text-white">
                    <span id="p2-btn-label" class="text-base font-extrabold uppercase">Bet</span>
                    <span id="p2-btn-val" class="text-lg font-black">1.00 USD</span>
                </button>
            </div>
        </div>

        <!-- Live Bets Bottom Table -->
        <div class="panel-bg rounded-2xl p-2.5 border border-zinc-800">
            <div class="flex items-center justify-center gap-6 border-b border-zinc-800 pb-2 text-xs font-bold text-gray-400">
                <button class="text-white border-b-2 border-red-600 pb-1">All Bets</button>
                <button class="hover:text-white">Previous</button>
                <button class="hover:text-white">Top</button>
            </div>

            <div class="flex items-center justify-between pt-2 text-[11px] text-gray-400 font-bold">
                <div class="flex items-center gap-1">
                    <span class="text-gray-300">299/430 Bets</span>
                </div>
                <div class="text-right">
                    <span class="text-white font-extrabold text-xs">2,365.98</span> <span class="text-gray-400">Total win USD</span>
                </div>
            </div>

            <div class="w-full bg-zinc-800 h-1 rounded-full mt-1.5 overflow-hidden">
                <div class="bg-green-500 h-full w-2/3"></div>
            </div>
        </div>

    </div>

    <!-- Deposit Modal -->
    <div id="deposit-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-xs p-5 relative">
            <button onclick="closeDepositModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-base font-extrabold text-white mb-3">Balansı Artır</h3>
            <input type="number" id="dep-amount" value="50" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-white font-bold text-base mb-3 focus:outline-none">
            <button onclick="confirmDeposit()" class="w-full btn-green-spribe py-3 font-bold text-white text-sm">Depozit Et</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if(tg) { tg.expand(); }

        // Audio Effects Engine
        class AviatorAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.osc = null;
            }
            init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playTakeoff() {
                if(!this.enabled) return;
                this.init();
                try {
                    this.osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    this.osc.type = 'sawtooth';
                    this.osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                    this.osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    this.osc.start();
                } catch(e){}
            }
            updatePitch(m) {
                if(this.osc && this.ctx) {
                    this.osc.frequency.setValueAtTime(Math.min(700, 100 + (m * 50)), this.ctx.currentTime);
                }
            }
            playWin() {
                if(!this.enabled) return;
                this.init();
                try {
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.type = 'sine';
                    o.frequency.setValueAtTime(600, this.ctx.currentTime);
                    o.frequency.exponentialRampToValueAtTime(1000, this.ctx.currentTime + 0.2);
                    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    o.connect(g); g.connect(this.ctx.destination);
                    o.start(); o.stop(this.ctx.currentTime + 0.2);
                } catch(e){}
            }
            stopEngine() {
                if(this.osc) {
                    try { this.osc.stop(); this.osc.disconnect(); } catch(e){}
                    this.osc = null;
                }
            }
        }

        const audio = new AviatorAudio();

        let balance = 3000.00;
        let gameState = 'flying';
        let currentMultiplier = 1.00;
        let crashPoint = 2.64;
        let flyStartTime = Date.now();

        const panels = {
            1: { amount: 1.00, state: 'idle', winAmount: 0 },
            2: { amount: 1.00, state: 'idle', winAmount: 0 }
        };

        const canvas = document.getElementById('aviatorCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if(gameState === 'flying' || gameState === 'crashed') {
                const startX = 20;
                const startY = canvas.height - 20;
                
                const progress = Math.min(1, (currentMultiplier - 1) / Math.max(1.5, crashPoint - 1));
                const endX = startX + (canvas.width - 60) * progress;
                const endY = startY - (canvas.height - 50) * progress;

                // Curved Flight Area Fill
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(startX + (endX - startX) * 0.4, startY, endX, endY);
                ctx.lineTo(endX, startY);
                ctx.closePath();
                
                const grad = ctx.createLinearGradient(0, endY, 0, startY);
                grad.addColorStop(0, 'rgba(229, 9, 20, 0.5)');
                grad.addColorStop(1, 'rgba(229, 9, 20, 0.0)');
                ctx.fillStyle = grad;
                ctx.fill();

                // Curved Line
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(startX + (endX - startX) * 0.4, startY, endX, endY);
                ctx.strokeStyle = '#e50914';
                ctx.lineWidth = 3.5;
                ctx.stroke();

                // Red Airplane
                if(gameState === 'flying') {
                    ctx.save();
                    ctx.translate(endX, endY);
                    ctx.fillStyle = '#e50914';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 14, 6, -Math.PI/12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            requestAnimationFrame(drawCanvas);
        }
        drawCanvas();

        function startFlightRound() {
            gameState = 'flying';
            flyStartTime = Date.now();
            crashPoint = (1.1 + Math.random() * 5.0);

            document.getElementById('waiting-text').classList.add('hidden');
            document.getElementById('crashed-display').classList.add('hidden');
            document.getElementById('multiplier-display').classList.remove('hidden');

            audio.playTakeoff();

            const flyInterval = setInterval(() => {
                if(gameState !== 'flying') {
                    clearInterval(flyInterval);
                    return;
                }

                const elapsed = (Date.now() - flyStartTime) / 1000;
                currentMultiplier = Math.max(1.00, Math.pow(1.18, elapsed));
                audio.updatePitch(currentMultiplier);

                document.getElementById('multiplier-display').innerText = currentMultiplier.toFixed(2) + 'x';

                if(currentMultiplier >= crashPoint) {
                    clearInterval(flyInterval);
                    triggerCrash();
                }
            }, 50);
        }

        function triggerCrash() {
            gameState = 'crashed';
            audio.stopEngine();

            document.getElementById('multiplier-display').classList.add('hidden');
            document.getElementById('crashed-display').classList.remove('hidden');
            document.getElementById('crashed-at-val').innerText = crashPoint.toFixed(2) + 'x';

            [1, 2].forEach(id => {
                const p = panels[id];
                if(p.state === 'active') {
                    p.state = 'idle';
                    updatePanelUI(id);
                }
            });

            setTimeout(() => {
                document.getElementById('crashed-display').classList.add('hidden');
                document.getElementById('waiting-text').classList.remove('hidden');
                setTimeout(startFlightRound, 3000);
            }, 2000);
        }

        function adjustBet(id, delta) {
            const p = panels[id];
            if(p.state !== 'idle') return;
            p.amount = Math.max(1.00, parseFloat((p.amount + delta).toFixed(2)));
            document.getElementById(`p${id}-amount`).innerText = p.amount.toFixed(2);
            document.getElementById(`p${id}-btn-val`).innerText = p.amount.toFixed(2) + ' USD';
        }

        function setBet(id, val) {
            const p = panels[id];
            if(p.state !== 'idle') return;
            p.amount = parseFloat(val.toFixed(2));
            document.getElementById(`p${id}-amount`).innerText = p.amount.toFixed(2);
            document.getElementById(`p${id}-btn-val`).innerText = p.amount.toFixed(2) + ' USD';
        }

        function handleBetClick(id) {
            const p = panels[id];
            if(p.state === 'idle') {
                if(balance < p.amount) { alert('Balansınız çatmır!'); return; }
                balance -= p.amount;
                updateBalanceUI();
                p.state = 'active';
                updatePanelUI(id);
            } else if(p.state === 'active' && gameState === 'flying') {
                p.winAmount = p.amount * currentMultiplier;
                balance += p.winAmount;
                updateBalanceUI();
                audio.playWin();
                p.state = 'idle';
                updatePanelUI(id);
            }
        }

        function updatePanelUI(id) {
            const p = panels[id];
            const btn = document.getElementById(`p${id}-btn`);
            const label = document.getElementById(`p${id}-btn-label`);
            const val = document.getElementById(`p${id}-btn-val`);

            if(p.state === 'idle') {
                btn.className = 'w-36 h-20 btn-green-spribe flex flex-col items-center justify-center text-white';
                label.innerText = 'Bet';
                val.innerText = p.amount.toFixed(2) + ' USD';
            } else if(p.state === 'active') {
                btn.className = 'w-36 h-20 btn-orange-spribe flex flex-col items-center justify-center text-white';
                label.innerText = 'CASH OUT';
                val.innerText = (p.amount * currentMultiplier).toFixed(2) + ' USD';
            }
        }

        function switchBetTab(id, tab) {
            const b = document.getElementById(`p${id}-tab-bet`);
            const a = document.getElementById(`p${id}-tab-auto`);
            if(tab === 'bet') {
                b.className = 'flex-1 py-1 tab-btn active';
                a.className = 'flex-1 py-1 tab-btn';
            } else {
                a.className = 'flex-1 py-1 tab-btn active';
                b.className = 'flex-1 py-1 tab-btn';
            }
        }

        function updateBalanceUI() {
            document.getElementById('balance-val').innerText = balance.toLocaleString('en-US', { minimumFractionDigits: 2 });
        }

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('hidden'); }
        function toggleSound() {
            audio.enabled = !audio.enabled;
            document.getElementById('sound-status').innerText = audio.enabled ? 'AÇIQ' : 'BAĞLI';
        }
        function openDepositModal() { document.getElementById('deposit-modal').classList.remove('hidden'); }
        function closeDepositModal() { document.getElementById('deposit-modal').classList.add('hidden'); }
        function confirmDeposit() {
            const amt = parseFloat(document.getElementById('dep-amount').value) || 0;
            balance += amt;
            updateBalanceUI();
            closeDepositModal();
        }

        startFlightRound();
    </script>
</body>
</html>
